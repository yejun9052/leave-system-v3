spring:
  config:
    # 로컬 전용 비밀값(공휴일 API 키, SMTP 계정 등): backend/application-secret.yml (.gitignore 대상).
    # 파일이 없어도 기동됨. 실행 위치가 프로젝트 루트/backend 어느 쪽이든 찾도록 두 경로를 둔다.
    import:
      - optional:file:./application-secret.yml
      - optional:file:./backend/application-secret.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/annual_leave}
    username: ${DB_USERNAME:leave}
    password: ${DB_PASSWORD:leave1234}
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        show_sql: true

server:
  servlet:
    session:
      cookie:
        # 로컬은 http://localhost 이므로 Secure 해제 (운영은 기본 true)
        secure: false

app:
  # 로컬/테스트 전용 고정 초기 관리자 비밀번호 (운영은 미설정 → 무작위 생성)
  admin:
    initial-password: admin1234!
  license:
