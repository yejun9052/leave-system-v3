spring:
  application:
    name: annual-leave
  # Docker secrets(/run/secrets/*) 를 설정값으로 로딩. 로컬엔 없으므로 optional.
  config:
    import: optional:configtree:/run/secrets/
  profiles:
    # 기본은 prod(안전). env 미지정으로 jar 를 직접 실행해도 local 시크릿으로 폴백되지 않음.
    # 로컬 개발은 gradlew bootRun(자동 local) 또는 --spring.profiles.active=local 로 실행.
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jackson:
    time-zone: Asia/Seoul
    # Jackson 3: 날짜 직렬화 옵션은 SerializationFeature → DateTimeFeature 로 이동
    datatype:
      datetime:
        write-dates-as-timestamps: false
  servlet:
    multipart:
      # 엑셀 업로드 등 파일 크기 제한 (DoS·압축폭탄 완화)
      max-file-size: 5MB
      max-request-size: 8MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 목록에서 직원·부서 등 연관 엔티티를 하나씩 불러오지 않고 묶어서(IN) 불러온다(N+1 완화)
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  task:
    scheduling:
      pool:
        # 자동 작업(공휴일·연차 부여·촉진·자동 백업)이 한 줄로 서지 않게. 백업이 길어져도 다른 작업이 밀리지 않는다
        size: 2
  session:
    # 미사용 자동 로그아웃 시간 (예: 10m, 30m). 환경변수 SESSION_TIMEOUT 으로 변경 가능.
    # 화면도 같은 값(/api/auth/me 의 idleTimeoutSeconds)으로 마우스·키보드 입력이 없으면 로그아웃한다
    timeout: ${SESSION_TIMEOUT:10m}
    jdbc:
      # 세션 테이블은 Flyway(V1__baseline)가 관리 → 자동 생성 끔
      initialize-schema: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    # 회사 SMTP. 운영의 비밀번호는 Docker secret(mail_password) → application-prod.yml
    # 로컬 계정·비밀번호는 backend/application-secret.yml(git 제외)에 입력
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # 받는 사람 중 한 주소가 거부돼도 나머지에게는 보낸다(숨은 참조 공지·참조 메일이 통째로 안 가지 않게)
          sendpartial: true
          # SMTP 응답 지연 시 발송 스레드가 묶이지 않도록 제한(ms)
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  # Caddy 뒤에서 실제 접속 IP·https 를 알기 위해. native = Tomcat RemoteIpValve: 사설망(도커 네트워크) 프록시가 보낸
  # X-Forwarded-For/Proto 만 믿는다. framework 는 클라이언트가 넣은 Forwarded 헤더를 먼저 믿어 로그인 차단(IP)을 우회할 수 있다
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # 세션 ID 쿠키: JS 접근 불가 · HTTPS 전용 · 교차 사이트 요청 시 미전송(Lax)
        http-only: true
        # HTTP 로 운영하는 경우(.env 모드 B)에만 SESSION_COOKIE_SECURE=false
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
    # XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 실어 보냄(기본 이름과 동일) → Swagger 에서 POST 가능
    csrf:
      enabled: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # 메일은 부가 기능(실패해도 요청은 성공)이므로 헬스 체크에서 제외(SMTP 장애로 health DOWN 방지)
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@annual-leave.local}
    # 메일 속 링크(로그인·비밀번호 재설정)의 기준 주소
    link-base-url: ${APP_ORIGIN:http://localhost:5173}
  holiday-api:
    # 공공데이터포털 한국천문연구원 특일 정보 API (공휴일 동기화)
    base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
    # 서비스 키(Decoding 키). 저장소에 커밋 금지 → 환경변수 HOLIDAY_API_KEY,
    # 로컬은 backend/application-secret.yml(git 제외 파일)에 입력
    service-key: ${HOLIDAY_API_KEY:}
  backup:
    # 백업 파일 폴더(정책 › 백업). 운영 컨테이너는 /backups (docker-compose.prod.yml 이 서버 폴더를 연결)
    dir: ${BACKUP_DIR:/backups}
    # pg_dump 가 있는 폴더. 비우면 PATH 의 pg_dump (운영 이미지에 postgresql-client-16 설치됨)
    pg-bin: ${BACKUP_PG_BIN:}
  license:
    # 라이선스는 항상 집행됩니다. 유효한 키가 없으면 모든 기능이 차단됩니다.
    key: ${LICENSE_KEY:}                 # 발급받은 라이선스 문자열 (운영 필수)
    host: ${LICENSE_HOST:}               # 설치처 고정 값(도메인 등)
