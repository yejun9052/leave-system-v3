# =====================================================================
# 운영 배포용 Docker Compose
#   web(Caddy, 자동 HTTPS) → backend(Spring Boot) → postgres
#   사용법: cp .env.prod.example .env  (값 수정 후)
#           docker compose -f docker-compose.prod.yml up -d --build
# =====================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: leave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      # 비밀번호는 Docker secret 파일에서 읽음 (.env 평문 저장 안 함)
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Seoul
    secrets:
      - db_password
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: leave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      # DB_PASSWORD 는 Docker secret 파일로 주입 (아래 secrets)
      CORS_ORIGINS: ${APP_ORIGIN}
      LICENSE_KEY: ${LICENSE_KEY}
      LICENSE_HOST: ${LICENSE_HOST}
      # 세션 쿠키 Secure 속성. HTTP 로 운영하는 모드 B 에서만 .env 에 false 지정
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # 메일 속 링크(로그인·비밀번호 재설정)의 기준 주소
      APP_ORIGIN: ${APP_ORIGIN}
      # 회사 SMTP (비밀번호는 Docker secret mail_password). 계정 메일 발송에 필수
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@annual-leave.local}
      TZ: Asia/Seoul
    secrets:
      - db_password
      - mail_password
      - holiday_api_key
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      # DB 백업 파일(정책 › 백업). 서버 폴더 주인은 앱 계정(uid 10001)이어야 쓸 수 있다 → install.sh 가 준비.
      # :z 는 SELinux 사용 서버(CentOS/RHEL)에서 컨테이너가 이 폴더에 쓸 수 있게 한다(그 밖의 서버에서는 무시)
      - ${BACKUP_DIR:-/var/backups/annual-leave}:/backups:z
    expose:
      - "8080"   # 내부 네트워크에서만 접근 (외부로 직접 노출하지 않음)

  web:
    build:
      context: ./frontend
    container_name: leave-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 도메인(HTTPS) 또는 :80(HTTP) — .env 참고
      SITE_ADDRESS: ${SITE_ADDRESS}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data      # 발급받은 인증서 보관 (재시작해도 유지)
      - caddy_config:/config

secrets:
  db_password:
    file: ./secrets/db_password
  # SMTP 비밀번호. SMTP 미사용이어도 파일은 있어야 함(빈 파일 가능)
  mail_password:
    file: ./secrets/mail_password
  # 공공데이터포털 특일 정보 API 서비스 키(Decoding 키). 미사용이어도 파일은 있어야 함(빈 파일 가능)
  holiday_api_key:
    file: ./secrets/holiday_api_key

volumes:
  pgdata:
  caddy_data:
  caddy_config:
