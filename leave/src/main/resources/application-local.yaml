spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:leave}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME:leave}
    password: ${DB_PASSWORD:leave}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: debug
    # 인증 정보의 해시를 포함한 바인딩 값을 로그에 남기지 않는다.
    org.hibernate.orm.jdbc.bind: off
    org.flywaydb: info
